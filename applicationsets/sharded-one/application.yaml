
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parent-app-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://github.com/valkiriaaquatica/argocd-kustomize-environments.git
    targetRevision: test/kargo-sharded-rollouts
    path: applicationsets/sharded-one/
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true